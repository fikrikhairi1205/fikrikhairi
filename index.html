<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fikri Khairi - Welcome</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        /* Animasi masuk yang halus */
        .fade-in-up { 
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            opacity: 0;
        }
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center selection:bg-slate-200">

    <main class="text-center px-6 max-w-3xl w-full fade-in-up">
        <div class="relative inline-block mb-8">
            <img 
                src="/fikri.jpeg" 
                alt="Fikri Khairi" 
                class="w-48 h-48 md:w-64 md:h-64 mx-auto rounded-full object-cover shadow-lg ring-[6px] ring-white"
            >
            <span class="absolute bottom-3 right-5 md:bottom-5 md:right-6 w-5 h-5 md:w-6 md:h-6 bg-green-500 border-[3px] border-white rounded-full"></span>
        </div>
        <h1 class="text-4xl md:text-6xl font-bold text-slate-900 tracking-tight mb-4">
            Fikri Khairi
        </h1>
        <p class="text-lg md:text-xl text-slate-500 mb-10 leading-relaxed font-medium">
            Informatics Student & Web Developer. <br class="hidden md:block"> 
            Building clean interfaces
        </p>
        <a 
            href="/profile" 
            class="inline-flex items-center justify-center px-8 py-3.5 md:px-10 md:py-4 text-base md:text-lg font-semibold text-white transition-all duration-300 bg-slate-900 rounded-full hover:bg-slate-800 hover:shadow-xl hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-slate-900/20"
        >
            View Full Profile
            <svg class="w-5 h-5 ml-2.5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
        </a>

    </main>

</body>
</html>
